# Tool configuration only. Comic Chaos runs from a checkout (`python main.py`)
# and is not packaged for installation.

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Pyflakes + the core pycodestyle errors. Kept explicit so new Ruff
# releases don't silently change what CI enforces.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
